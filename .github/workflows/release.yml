name: Release
# On a v* tag in the public repository: test, build, publish to PyPI with trusted
# publishing (no token), then attach the wheel and SHA256SUMS to the GitHub Release
# that `netconverter update` and the installers read. PyPI goes first, so a
# release is never "latest" on GitHub before `uv tool upgrade` can see it.
# Setup and the release checklist: docs/RELEASING.md.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'valeronlabs/netconverter_terminals'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - name: Tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != pyproject ${version}"; exit 1; }
          grep -q "__version__ = \"${version}\"" src/netconverter_cli/__init__.py
          grep -q "^## ${version} " CHANGELOG.md
      - run: uv sync --frozen --group dev
      - run: uv run pytest tests -q
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: SHA256SUMS and release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir release
          cp "dist/netconverter_cli-${version}-py3-none-any.whl" release/
          (cd release && sha256sum "netconverter_cli-${version}-py3-none-any.whl" > SHA256SUMS)
          {
            echo "**NetConverter CLI ${version}**"
            echo
            echo '### Install or update'
            echo '```sh'
            echo 'curl -LsSf https://netconverter.ai/install.sh | sh     # macOS / Linux; Windows: irm https://netconverter.ai/install.ps1 | iex'
            echo 'netconverter update                                    # already installed'
            echo '```'
            echo "PyPI: \`uv tool install --python 3.12 netconverter-cli\`. Wheel: check it with \`shasum -a 256 -c SHA256SUMS\`, then \`uv tool install --python 3.12 --force ./netconverter_cli-${version}-py3-none-any.whl\`."
            echo
            awk -v v="## ${version} " 'index($0, v) == 1 {on = 1; next} on && /^## / {exit} on' CHANGELOG.md
          } > release/NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/netconverter-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release/
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          wheel="release/netconverter_cli-${version}-py3-none-any.whl"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${wheel}" release/SHA256SUMS --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${wheel}" release/SHA256SUMS \
              --title "NetConverter CLI ${GITHUB_REF_NAME}" --notes-file release/NOTES.md --verify-tag
          fi
